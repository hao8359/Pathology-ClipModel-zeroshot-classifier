[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathclip-zero-shot-classifier"
version = "0.1.0"
description = "Zero-shot classification and evaluation pipeline using PathCLIP / OpenCLIP"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "open-clip-torch",
    "ftfy",
    "regex",
    "tqdm",
    "scikit-learn",
    "pandas<1.6.0",
    "numpy<1.25",
    "pillow",
    "h5py",
    "matplotlib",
    "wandb",
    "protobuf>=4.21,<5",
    "webdataset",
    "braceexpand",
]

[tool.uv]
package = false